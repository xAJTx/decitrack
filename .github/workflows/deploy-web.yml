name: Deploy Web App

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Export Web
        run: |
          cd frontend
          npm install --legacy-peer-deps
          
          # Fixe le chemin web et vide la mémoire cache (-c)
          EXPO_PUBLIC_BASE_PATH=/decitrack npx expo export -c
          
          # Autorise les dossiers techniques
          touch dist/.nojekyll
          
          # Le filet de sécurité anti-404 pour GitHub Pages !
          cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
