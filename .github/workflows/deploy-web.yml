name: Deploy Web App

on:
  push:
    branches: [ main ]

# Donne les permissions à GitHub de publier la page web
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Export Web
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npx expo export
          
          # 1. Empêche GitHub Pages de masquer les dossiers d'Expo
          touch dist/.nojekyll
          
          # 2. Correction de force brute : ajoute le nom du projet devant les chemins absolus
          sed -i 's|href="/|href="/decitrack/|g' dist/index.html
          sed -i 's|src="/|src="/decitrack/|g' dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
